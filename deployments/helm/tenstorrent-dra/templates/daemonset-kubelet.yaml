apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tenstorrent-dra.name" . }}-kubelet
spec:
  selector:
    matchLabels: {app: tenstorrent-dra-kubelet}
  template:
    metadata:
      labels: {app: tenstorrent-dra-kubelet}
    spec:
      serviceAccountName: {{ include "tenstorrent-dra.name" . }}
      priorityClassName: {{ .Values.priorityClassName }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
      - name: kubelet
        image: {{ include "tenstorrent-dra.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["-kubelet-plugin", "-node-name", "$(NODE_NAME)", "-device-root", "{{ .Values.deviceRoot }}", "-sysfs-root", "{{ .Values.sysfsRoot }}", "-pci-sysfs-root", "{{ .Values.pciSysfsRoot }}", "-state-dir", "{{ .Values.stateDir }}", "-cdi-dir", "{{ .Values.cdiDir }}", "-plugin-dir", "{{ .Values.pluginDir }}", "-registrar-dir", "{{ .Values.registrarDir }}"]
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        securityContext: {privileged: true}
        volumeMounts:
        - {name: device, mountPath: {{ .Values.deviceRoot }}, readOnly: true}
        - {name: sysfs, mountPath: {{ .Values.sysfsRoot }}, readOnly: true}
        - {name: pci, mountPath: {{ .Values.pciSysfsRoot }}, readOnly: true}
        - {name: state, mountPath: {{ .Values.stateDir }}}
        - {name: cdi, mountPath: {{ .Values.cdiDir }}}
        - {name: plugin, mountPath: {{ .Values.pluginDir }}}
        - {name: registrar, mountPath: {{ .Values.registrarDir }}}
      volumes:
      - {name: device, hostPath: {path: {{ .Values.deviceRoot }}, type: Directory}}
      - {name: sysfs, hostPath: {path: {{ .Values.sysfsRoot }}, type: Directory}}
      - {name: pci, hostPath: {path: {{ .Values.pciSysfsRoot }}, type: Directory}}
      - {name: state, hostPath: {path: {{ .Values.stateDir }}, type: DirectoryOrCreate}}
      - {name: cdi, hostPath: {path: {{ .Values.cdiDir }}, type: DirectoryOrCreate}}
      - {name: plugin, hostPath: {path: {{ .Values.pluginDir }}, type: DirectoryOrCreate}}
      - {name: registrar, hostPath: {path: {{ .Values.registrarDir }}, type: DirectoryOrCreate}}
