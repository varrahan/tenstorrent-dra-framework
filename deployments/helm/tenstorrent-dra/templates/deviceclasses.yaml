apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-wormhole-n150
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "wormhole" && device.attributes["tenstorrent.com"].cardSeries == "n150"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-wormhole-n300
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "wormhole" && device.attributes["tenstorrent.com"].cardSeries == "n300"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-blackhole-p100
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "blackhole" && device.attributes["tenstorrent.com"].cardSeries == "p100"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-blackhole-p150
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "blackhole" && device.attributes["tenstorrent.com"].cardSeries == "p150"
