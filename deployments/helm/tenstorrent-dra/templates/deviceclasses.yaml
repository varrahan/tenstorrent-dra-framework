apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-wormhole
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "wormhole"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: tenstorrent-blackhole
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.tenstorrent.com" && device.attributes["tenstorrent.com"].chipSeries == "blackhole"
