apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "tenstorrent-dra.fullname" . }}-node
  labels:
    {{- include "tenstorrent-dra.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
spec:
  revisionHistoryLimit: 10
  minReadySeconds: {{ .Values.node.minReadySeconds }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.node.rollout.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "tenstorrent-dra.selectorLabels" (dict "root" . "component" "node") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenstorrent-dra.componentLabels" (dict "root" . "component" "node") | nindent 8 }}
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "tenstorrent-dra.fullname" . }}-node
      automountServiceAccountToken: true
      priorityClassName: {{ include "tenstorrent-dra.nodePriorityClassName" . }}
      terminationGracePeriodSeconds: {{ .Values.node.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
      - key: tenstorrent.com/accelerator-unhealthy
        operator: Exists
        effect: NoSchedule
      {{- with .Values.node.tolerations }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: node
        image: {{ include "tenstorrent-dra.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args:
        - node
        - -device-root={{ .Values.deviceRoot }}
        - -sysfs-root={{ .Values.sysfsRoot }}
        - -pci-sysfs-root={{ .Values.pciSysfsRoot }}
        - -state-dir={{ .Values.stateDir }}
        - -cdi-dir={{ .Values.cdiDir }}
        - -plugin-dir={{ .Values.pluginDir }}
        - -registrar-dir={{ .Values.registrarDir }}
        - -interval={{ .Values.interval }}
        - -inventory-grace-period={{ .Values.inventoryGracePeriod }}
        - -reset-mode={{ .Values.resetMode }}
        - -require-iommu={{ .Values.requireIOMMU }}
        - -http-address=:{{ .Values.httpPort }}
        - -kube-api-qps={{ .Values.kubeAPI.qps }}
        - -kube-api-burst={{ .Values.kubeAPI.burst }}
        ports:
        - name: http
          containerPort: {{ .Values.httpPort }}
          protocol: TCP
        startupProbe:
          httpGet: {path: /startupz, port: http}
          failureThreshold: {{ .Values.node.startupProbe.failureThreshold }}
          periodSeconds: {{ .Values.node.startupProbe.periodSeconds }}
        readinessProbe:
          httpGet: {path: /readyz, port: http}
          failureThreshold: {{ .Values.node.readinessProbe.failureThreshold }}
          periodSeconds: {{ .Values.node.readinessProbe.periodSeconds }}
        livenessProbe:
          httpGet: {path: /livez, port: http}
          failureThreshold: {{ .Values.node.livenessProbe.failureThreshold }}
          periodSeconds: {{ .Values.node.livenessProbe.periodSeconds }}
        resources:
          {{- toYaml .Values.node.resources | nindent 10 }}
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - {name: device, mountPath: {{ .Values.deviceRoot | quote }}}
        - {name: tt-sysfs, mountPath: {{ .Values.sysfsRoot | quote }}, readOnly: true}
        - {name: pci-sysfs, mountPath: {{ .Values.pciSysfsRoot | quote }}, readOnly: true}
        - {name: sysfs-devices, mountPath: {{ .Values.sysfsDevicesRoot | quote }}, readOnly: true}
        - {name: state, mountPath: {{ .Values.stateDir | quote }}}
        - {name: cdi, mountPath: {{ .Values.cdiDir | quote }}}
        - {name: plugin, mountPath: {{ .Values.pluginDir | quote }}}
        - {name: registrar, mountPath: {{ .Values.registrarDir | quote }}}
      volumes:
      - {name: device, hostPath: {path: {{ .Values.deviceRoot | quote }}, type: Directory}}
      - {name: tt-sysfs, hostPath: {path: {{ .Values.sysfsRoot | quote }}, type: Directory}}
      - {name: pci-sysfs, hostPath: {path: {{ .Values.pciSysfsRoot | quote }}, type: Directory}}
      - {name: sysfs-devices, hostPath: {path: {{ .Values.sysfsDevicesRoot | quote }}, type: Directory}}
      - {name: state, hostPath: {path: {{ .Values.stateDir | quote }}, type: DirectoryOrCreate}}
      - {name: cdi, hostPath: {path: {{ .Values.cdiDir | quote }}, type: DirectoryOrCreate}}
      - {name: plugin, hostPath: {path: {{ .Values.pluginDir | quote }}, type: DirectoryOrCreate}}
      - {name: registrar, hostPath: {path: {{ .Values.registrarDir | quote }}, type: DirectoryOrCreate}}
