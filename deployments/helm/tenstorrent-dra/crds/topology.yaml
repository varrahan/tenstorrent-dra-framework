apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentnodetopologies.topology.tenstorrent.com
spec:
  group: topology.tenstorrent.com
  scope: Cluster
  names:
    plural: tenstorrentnodetopologies
    singular: tenstorrentnodetopology
    kind: TenstorrentNodeTopology
    shortNames: [ttnt]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [nodeName, observedAt, devices]
            properties:
              nodeName: {type: string}
              observedAt: {type: string, format: date-time}
              devices: {type: array, items: {type: object}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentfabrictopologies.topology.tenstorrent.com
spec:
  group: topology.tenstorrent.com
  scope: Cluster
  names:
    plural: tenstorrentfabrictopologies
    singular: tenstorrentfabrictopology
    kind: TenstorrentFabricTopology
    shortNames: [ttft]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              generation: {type: string}
              valid: {type: boolean}
              endpoints: {type: array, items: {type: object}}
              errors: {type: array, items: {type: string}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentworkloads.scheduling.tenstorrent.com
spec:
  group: scheduling.tenstorrent.com
  scope: Namespaced
  names:
    plural: tenstorrentworkloads
    singular: tenstorrentworkload
    kind: TenstorrentWorkload
    shortNames: [ttw]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [containerName, podTemplate, ranks]
            properties:
              containerName: {type: string}
              podTemplate: {type: object}
              topology: {type: object}
              ranks:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [name, deviceClassName]
                  properties:
                    name: {type: string}
                    deviceClassName: {type: string}
                    count: {type: integer, minimum: 1}
                    chipSeries: {type: string}
                    cardSeries: {type: string}
