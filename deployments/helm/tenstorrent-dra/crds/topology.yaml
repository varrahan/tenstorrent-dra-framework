  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            properties:
              generation: {type: string}
              observedAt: {type: string, format: date-time}
              valid: {type: boolean}
              endpoints:
                type: array
                items:
                  type: object
                  required: [nodeName, pool, deviceName, stableID, chipSeries, cardSeries, endpointID]
                  properties:
                    nodeName: {type: string}
                    pool: {type: string}
                    deviceName: {type: string}
                    stableID: {type: string}
                    chipSeries: {type: string}
                    cardSeries: {type: string}
                    fabricID: {type: string}
                    ringID: {type: string}
                    endpointID: {type: string}
                    links:
                      type: array
                      items:
                        type: object
                        properties:
                          name: {type: string}
                          state: {type: string}
                          speedGbps: {type: integer}
                          remoteEndpointID: {type: string}
              errors: {type: array, items: {type: string}}
              conditions: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentworkloads.scheduling.tenstorrent.com
spec:
  group: scheduling.tenstorrent.com
  scope: Namespaced
  names:
    plural: tenstorrentworkloads
    singular: tenstorrentworkload
    kind: TenstorrentWorkload
    shortNames: [ttw]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [containerName, podTemplate, ranks]
            properties:
              containerName: {type: string}
              podTemplate: {type: object, x-kubernetes-preserve-unknown-fields: true}
              topology:
                type: object
                properties:
                  fabricID: {type: string}
                  ringID: {type: string}
              ranks:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [name, deviceClassName]
                  properties:
                    name: {type: string}
                    deviceClassName: {type: string}
                    count: {type: integer, minimum: 1}
                    chipSeries: {type: string}
                    cardSeries: {type: string}
          status:
            type: object
            properties:
              phase: {type: string}
              fabricGeneration: {type: string}
              assignments:
                type: array
                items:
                  type: object
                  properties:
                    rank: {type: string}
                    nodeName: {type: string}
                    claimName: {type: string}
                    podName: {type: string}
                    devices:
                      type: array
                      items:
                        type: object
                        properties:
                          pool: {type: string}
                          name: {type: string}
                          stableID: {type: string}
                          endpointID: {type: string}
              conditions: {type: array, items: {type: object, x-kubernetes-preserve-unknown-fields: true}}
