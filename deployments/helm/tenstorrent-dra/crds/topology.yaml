apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentnodetopologies.topology.tenstorrent.com
  labels:
    app.kubernetes.io/name: tenstorrent-dra
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tenstorrent-dra
    app.kubernetes.io/managed-by: Helm
spec:
  group: topology.tenstorrent.com
  scope: Cluster
  names:
    plural: tenstorrentnodetopologies
    singular: tenstorrentnodetopology
    kind: TenstorrentNodeTopology
    shortNames: [ttnt]
  versions:
  - &nodeVersion
    name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [nodeName, observedAt, devices]
            properties:
              nodeName: {type: string, minLength: 1, maxLength: 253}
              observedAt: {type: string, format: date-time}
              devices:
                type: array
                maxItems: 2048
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [pool, name, stableID, chipSeries]
                  properties:
                    pool: {type: string, minLength: 1, maxLength: 253}
                    name: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    stableID: {type: string, minLength: 1, maxLength: 133}
                    chipSeries: {type: string, enum: [wormhole, blackhole]}
                    fabricID: {type: string, maxLength: 128}
                    ringID: {type: string, maxLength: 128}
                    endpointID: {type: string, maxLength: 128}
                    links:
                      type: array
                      maxItems: 32
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, minLength: 1, maxLength: 63}
                          state: {type: string, enum: [up, down, unknown]}
                          speedGbps: {type: integer, format: int64, minimum: 0}
                          remoteEndpointID: {type: string, maxLength: 128}
  - <<: *nodeVersion
    name: v1alpha1
    storage: false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentfabrictopologies.topology.tenstorrent.com
  labels:
    app.kubernetes.io/name: tenstorrent-dra
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tenstorrent-dra
    app.kubernetes.io/managed-by: Helm
spec:
  group: topology.tenstorrent.com
  scope: Cluster
  names:
    plural: tenstorrentfabrictopologies
    singular: tenstorrentfabrictopology
    kind: TenstorrentFabricTopology
    shortNames: [ttft]
  versions:
  - &fabricVersion
    name: v1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          status:
            type: object
            required: [generation, observedAt, valid, endpoints, errors, conditions]
            properties:
              generation: {type: string, pattern: '^[a-f0-9]{16}$'}
              observedAt: {type: string, format: date-time}
              valid: {type: boolean}
              endpoints:
                type: array
                maxItems: 2048
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [endpointID]
                items:
                  type: object
                  required: [nodeName, pool, deviceName, stableID, chipSeries, fabricID, ringID, endpointID]
                  properties:
                    nodeName: {type: string, minLength: 1, maxLength: 253}
                    pool: {type: string, minLength: 1, maxLength: 253}
                    deviceName: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    stableID: {type: string, minLength: 1, maxLength: 133}
                    chipSeries: {type: string, enum: [wormhole, blackhole]}
                    fabricID: {type: string, minLength: 1, maxLength: 128}
                    ringID: {type: string, minLength: 1, maxLength: 128}
                    endpointID: {type: string, minLength: 1, maxLength: 128}
                    links:
                      type: array
                      maxItems: 32
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [name]
                        properties:
                          name: {type: string, minLength: 1, maxLength: 63}
                          state: {type: string, enum: [up, down, unknown]}
                          speedGbps: {type: integer, format: int64, minimum: 0}
                          remoteEndpointID: {type: string, maxLength: 128}
              errors:
                type: array
                maxItems: 2048
                items: {type: string, maxLength: 512}
              conditions:
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items: &condition
                  type: object
                  required: [type, status, reason, message, lastTransitionTime]
                  properties:
                    type: {type: string, minLength: 1, maxLength: 63}
                    status: {type: string, enum: ['True', 'False', Unknown]}
                    observedGeneration: {type: integer, format: int64, minimum: 0}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string, minLength: 1, maxLength: 1024}
                    message: {type: string, maxLength: 32768}
  - <<: *fabricVersion
    name: v1alpha1
    storage: false
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentworkloads.scheduling.tenstorrent.com
  labels:
    app.kubernetes.io/name: tenstorrent-dra
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tenstorrent-dra
    app.kubernetes.io/managed-by: Helm
spec:
  group: scheduling.tenstorrent.com
  scope: Namespaced
  names:
    plural: tenstorrentworkloads
    singular: tenstorrentworkload
    kind: TenstorrentWorkload
    shortNames: [ttw]
  versions:
  - &workloadVersion
    name: v1
    served: true
    storage: true
    subresources: {status: {}}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        x-kubernetes-validations:
        - rule: '!has(oldSelf.status) || !has(oldSelf.status.assignments) || size(oldSelf.status.assignments) == 0 || self.spec == oldSelf.spec'
          message: spec is immutable after assignment
        properties:
          spec:
            type: object
            required: [containerName, podTemplate, ranks]
            x-kubernetes-validations:
            - rule: 'self.ranks.map(rank, rank.count).sum() <= 128'
              message: a workload may request at most 128 devices
            properties:
              containerName: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
              podTemplate:
                type: object
                required: [spec]
                properties:
                  metadata:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  spec:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              topology:
                type: object
                properties:
                  fabricID: {type: string, maxLength: 128}
                  ringID: {type: string, maxLength: 128}
              ranks:
                type: array
                minItems: 1
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name, deviceClassName, count]
                  properties:
                    name: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    deviceClassName: {type: string, enum: [tenstorrent, tenstorrent-wormhole, tenstorrent-blackhole]}
                    count: {type: integer, format: int64, minimum: 1, maximum: 128}
                    chipSeries: {type: string, enum: [wormhole, blackhole]}
          status:
            type: object
            required: [phase, observedGeneration, conditions]
            properties:
              phase: {type: string, enum: [Pending, Assigned, Running, Degraded, Failed, Succeeded]}
              observedGeneration: {type: integer, format: int64, minimum: 0}
              specHash: {type: string, pattern: '^[a-f0-9]{16}$'}
              fabricGeneration: {type: string, pattern: '^[a-f0-9]{16}$'}
              assignments:
                type: array
                maxItems: 64
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [rank]
                items:
                  type: object
                  required: [rank, nodeName, claimName, podName, devices]
                  properties:
                    rank: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    nodeName: {type: string, minLength: 1, maxLength: 253}
                    claimName: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    podName: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                    devices:
                      type: array
                      minItems: 1
                      maxItems: 128
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [name]
                      items:
                        type: object
                        required: [pool, name, stableID, endpointID]
                        properties:
                          pool: {type: string, minLength: 1, maxLength: 253}
                          name: {type: string, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$', maxLength: 63}
                          stableID: {type: string, minLength: 1, maxLength: 133}
                          endpointID: {type: string, minLength: 1, maxLength: 128}
              conditions:
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items:
                  type: object
                  required: [type, status, reason, message, lastTransitionTime]
                  properties:
                    type: {type: string, minLength: 1, maxLength: 63}
                    status: {type: string, enum: ['True', 'False', Unknown]}
                    observedGeneration: {type: integer, format: int64, minimum: 0}
                    lastTransitionTime: {type: string, format: date-time}
                    reason: {type: string, minLength: 1, maxLength: 1024}
                    message: {type: string, maxLength: 32768}
  - <<: *workloadVersion
    name: v1alpha1
    storage: false
