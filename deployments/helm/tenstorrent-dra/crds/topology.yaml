apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentnodetopologies.topology.tenstorrent.com
spec:
  group: topology.tenstorrent.com
  scope: Cluster
  names:
    plural: tenstorrentnodetopologies
    singular: tenstorrentnodetopology
    kind: TenstorrentNodeTopology
    shortNames: [ttnt]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [nodeName, observedAt, devices]
            properties:
              nodeName: {type: string}
              observedAt: {type: string, format: date-time}
              devices:
                type: array
                items:
                  type: object
                  required: [pool, name, stableID, chipSeries, cardSeries]
                  properties:
                    pool: {type: string}
                    name: {type: string}
                    stableID: {type: string}
                    chipSeries: {type: string}
                    cardSeries: {type: string}
                    fabricID: {type: string}
                    ringID: {type: string}
                    endpointID: {type: string}
                    links:
                      type: array
                      items:
                        type: object
                        properties:
                          name: {type: string}
                          state: {type: string}
                          speedGbps: {type: integer}
                          remoteEndpointID: {type: string}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenstorrentfabrictopologies.topology.tenstorrent.com
