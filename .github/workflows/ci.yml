name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24.0'
        cache: true
    - run: make build test fmt-check
  helm:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - run: make helm-lint
