name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vm-certification:
    name: QEMU VM certification
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, tt-qemu-vm]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run exact-commit smoke and chaos certification
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/tt-vm-certification-${{ github.sha }}
        run: bash test/vm/certify.sh "$GITHUB_SHA" "$EVIDENCE_DIR"
      - name: Preserve VM certification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-certification-${{ github.sha }}
          path: ${{ runner.temp }}/tt-vm-certification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30

  quality:
    name: Go, policy, and workflow gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.12
          cache: true
      - name: Verify modules and build
        run: go mod verify && make fmt-check vet build
      - name: Static analysis
        run: make staticcheck
      - name: Race detector and coverage policy
        run: make coverage-check
      - name: Go vulnerability database
        run: make govulncheck
      - name: Dependency license policy
        run: make license-check
      - name: Secret history scan
        run: make secret-scan
      - name: Workflow and packaging policy
        run: make actionlint supply-chain-check
      - name: Shell analysis
        run: make shellcheck

  helm:
    name: Helm package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3
      - run: make helm-lint helm-package

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // empty')"
          if [ "$status" = "enabled" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is ${status:-disabled}; skipping dependency review."
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: steps.dependency-graph.outputs.supported == 'true'
        id: dependency-review
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, ImageMagick, MIT, MPL-2.0
          retry-on-snapshot-warnings: true

  image:
    name: Production image and SBOM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Derive reproducible metadata
        id: metadata
        shell: bash
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u --date="@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: tt-dra-ci:${{ github.sha }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=0.0.0-ci.${{ github.run_number }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime identity and metadata
        run: |
          test "$(docker image inspect "tt-dra-ci:${GITHUB_SHA}" --format '{{.Config.User}}')" = '65532:65532'
          docker run --rm "tt-dra-ci:${GITHUB_SHA}" version | grep -F "\"commit\":\"${GITHUB_SHA}\""
      - name: Verify reproducible image output
        env:
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
          SOURCE_DATE_EPOCH: ${{ steps.metadata.outputs.epoch }}
        run: |
          first="$(docker image inspect "tt-dra-ci:${GITHUB_SHA}" --format '{{.Id}}')"
          docker build --no-cache --provenance=false --tag "tt-dra-ci-rebuild:${GITHUB_SHA}" \
            --build-arg VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" .
          second="$(docker image inspect "tt-dra-ci-rebuild:${GITHUB_SHA}" --format '{{.Id}}')"
          test "$first" = "$second"
      - name: Scan production image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: tt-dra-ci:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          grype-version: v0.112.0
          cache-db: true
      - name: Generate CI image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: tt-dra-ci:${{ github.sha }}
          format: spdx-json
          output-file: tt-dra-ci.spdx.json
          upload-artifact: false
          syft-version: v1.44.0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tt-dra-ci-sbom
          path: tt-dra-ci.spdx.json
          if-no-files-found: error
          retention-days: 14
