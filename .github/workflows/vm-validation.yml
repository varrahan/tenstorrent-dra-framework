name: VM validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ttsim:
    name: QEMU ttsim and Kubernetes v1.34 validation
    runs-on: [self-hosted, linux, ttsim]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate VM foundation, tt-kmd, kind, and GA DRA APIs
        run: make vm-validation
