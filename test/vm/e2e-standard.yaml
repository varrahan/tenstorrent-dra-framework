apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: tt-e2e-standard
spec:
  devices:
    requests:
    - name: accelerator
      exactly:
        deviceClassName: tenstorrent-blackhole
        allocationMode: ExactCount
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: tt-e2e-standard
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  resourceClaims:
  - name: tenstorrent
    resourceClaimName: tt-e2e-standard
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: worker
    image: tenstorrent-dra-e2e:dev
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-ec"]
    args:
    - |
      devices="$(find /dev/tenstorrent -mindepth 1 -maxdepth 1 -type c -print | sort)"
      test "$(printf '%s\n' "$devices" | sed '/^$/d' | wc -l)" -eq 1
      printf 'devices=%s\n' "$devices"
      sleep 300
    resources:
      claims:
      - name: tenstorrent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
      readOnlyRootFilesystem: true
      runAsNonRoot: true
