kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        leader-elect-lease-duration: "600s"
        leader-elect-renew-deadline: "480s"
        leader-elect-retry-period: "30s"
    scheduler:
      extraArgs:
        leader-elect-lease-duration: "600s"
        leader-elect-renew-deadline: "480s"
        leader-elect-retry-period: "30s"
- role: worker
  image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  extraMounts:
  - {hostPath: /tmp/tt-node-a/dev/tenstorrent, containerPath: /dev/tenstorrent}
  - {hostPath: /tmp/tt-node-a/sys, containerPath: /tt-sys}
  - {hostPath: /sys/kernel/security, containerPath: /sys/kernel/security}
- role: worker
  image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  extraMounts:
  - {hostPath: /tmp/tt-node-b/dev/tenstorrent, containerPath: /dev/tenstorrent}
  - {hostPath: /tmp/tt-node-b/sys, containerPath: /tt-sys}
  - {hostPath: /sys/kernel/security, containerPath: /sys/kernel/security}
